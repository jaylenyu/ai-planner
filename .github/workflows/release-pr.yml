name: Create Release PR

on:
  push:
    branches: [canary]

concurrency:
  group: release-pr
  cancel-in-progress: false

jobs:
  release-pr:
    name: Open canary → main PR
    runs-on: ubuntu-latest
    steps:
      - name: Check token
        env:
          RELEASE_PR_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
        run: |
          # GITHUB_TOKEN으로 만든 PR은 CI가 트리거되지 않아 main 필수 체크를 통과할 수 없음
          if [ -z "$RELEASE_PR_TOKEN" ]; then
            echo "::error::RELEASE_PR_TOKEN 시크릿이 없습니다. (contents/pull-requests: write 권한 PAT 필요)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create PR if missing
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
        run: |
          set -euo pipefail

          existing=$(gh pr list --base main --head canary --state open --json number -q '.[0].number')
          if [ -n "$existing" ]; then
            echo "이미 열린 PR #$existing 이 있어 생성하지 않습니다."
            exit 0
          fi

          commits=$(git log --no-merges --format='- %s' origin/main..origin/canary)
          if [ -z "$commits" ]; then
            echo "main 대비 변경 사항이 없어 생성하지 않습니다."
            exit 0
          fi

          body=$(printf '## 변경 사항\n%s\n\n> canary 머지 시 자동 생성된 PR입니다. release 라벨이 없으면 patch로 태깅됩니다.\n' "$commits")

          gh pr create \
            --base main \
            --head canary \
            --title "release: canary → main ($(TZ=Asia/Seoul date +%Y-%m-%d))" \
            --body "$body" \
            --assignee jaylenyu
