name: Auto Assign PR

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  assign:
    name: Assign Default Assignee
    if: github.event.pull_request.assignees[0] == null
    runs-on: ubuntu-latest
    steps:
      - name: Add jaylenyu as assignee
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr edit "$PR_URL" --add-assignee jaylenyu
